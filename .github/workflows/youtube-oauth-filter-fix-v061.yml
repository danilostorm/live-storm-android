name: Build Live Storm OAuth Fix v0.6.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_youtube_broadcast_filter_fix_v061.py'
      - '.github/workflows/youtube-oauth-filter-fix-v061.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Corrigir filtros da API do YouTube
        run: python tools/apply_youtube_broadcast_filter_fix_v061.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compilar APK v0.6.1
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK corrigido
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-v061-oauth-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Salvar correção na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hoststorm/livestorm/YoutubeLiveApi.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada'
            exit 0
          fi
          git commit -m 'Corrige filtros incompatíveis da API do YouTube'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
