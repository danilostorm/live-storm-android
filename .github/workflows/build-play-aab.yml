name: Build Play Store AAB

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-play-aab.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compilar AAB release sem chave no repositório
        run: gradle --no-daemon clean bundleRelease

      - name: Publicar AAB para assinatura externa
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-v051-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
