name: Apply Camera Pro Upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_pro_upgrade.py'
      - 'app/src/main/java/com/hoststorm/livestorm/CameraProController.kt'
      - 'app/src/main/java/com/hoststorm/livestorm/OverlayController.kt'
      - 'app/src/main/res/layout/dialog_camera_pro.xml'
      - 'app/src/main/res/layout/dialog_overlay_settings.xml'
      - 'app/src/main/res/drawable/bg_focus_indicator.xml'
      - '.github/workflows/apply-camera-pro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply Pro upgrade
        run: python tools/apply_pro_upgrade.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Live Storm Pro APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload Live Storm Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-camera-pro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit applied source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hoststorm/livestorm/MainActivity.kt \
                  app/src/main/res/layout/activity_main.xml \
                  app/src/main/res/layout/dialog_stream_settings.xml \
                  README.md
          if git diff --cached --quiet; then
            echo 'No generated source changes to commit'
            exit 0
          fi
          git commit -m 'Integra zoom, câmera Pro e overlay web'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
