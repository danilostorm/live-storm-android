name: Build Live Storm v0.5.1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_v051.py'
      - 'app/src/main/res/layout/sheet_stream_quality.xml'
      - '.github/workflows/build-v051.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Aplicar interface de qualidade v0.5.1
        run: python tools/apply_v051.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compilar APK v0.5.1
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK v0.5.1
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-v051-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Salvar código gerado na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hoststorm/livestorm/MainActivity.kt \
                  app/build.gradle.kts README.md
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada para salvar'
            exit 0
          fi
          git commit -m 'Separa qualidade em painel profissional'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
