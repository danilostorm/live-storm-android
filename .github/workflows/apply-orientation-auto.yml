name: Apply orientation auto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply orientation patch
        run: |
          if grep -q "autoOrientationButton" app/src/main/java/com/hoststorm/livestorm/MainActivity.kt; then
            echo "Patch already applied"
            exit 0
          fi
          git apply --check .github/orientation-auto.patch
          git apply .github/orientation-auto.patch
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/res/layout/activity_main.xml')
          ET.parse('app/src/main/AndroidManifest.xml')
          print('XML validado')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build updated APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload updated APK
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-orientation-auto-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit source changes
        run: |
          if git diff --quiet -- app/src/main/java/com/hoststorm/livestorm/MainActivity.kt app/src/main/res/layout/activity_main.xml README.md; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/hoststorm/livestorm/MainActivity.kt app/src/main/res/layout/activity_main.xml README.md
          git commit -m "Adiciona orientação automática da live"
          git push origin HEAD:main
