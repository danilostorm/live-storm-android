name: Build Live Storm v0.5.0

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/v050/**'
      - '.github/workflows/apply-v050.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Aplicar reorganização v0.5.0
        run: |
          mkdir -p tools
          base64 -d .github/v050/apply_v050.py.gz.b64 | gzip -d > tools/apply_v050.py
          echo 'bb1560e09a2919fbfb27a607f9e20d11c527f7dea54e6e25ad71f15cf4b0cfda  tools/apply_v050.py' | sha256sum -c -
          python tools/apply_v050.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Compilar APK v0.5.0
        run: gradle --no-daemon clean assembleDebug

      - name: Publicar APK v0.5.0
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-v050-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Salvar código gerado na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hoststorm/livestorm/MainActivity.kt app/build.gradle.kts README.md
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada'
            exit 0
          fi
          git commit -m 'Integra interface profissional da v0.5.0'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
