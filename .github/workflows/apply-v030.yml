name: Apply Live Storm v0.3.0

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/v030/**'
      - '.github/workflows/apply-v030.yml'
      - 'app/src/main/java/com/hoststorm/livestorm/StreamingSource.kt'
      - 'app/src/main/java/com/hoststorm/livestorm/LocalRecordingUtils.kt'
      - 'app/src/main/java/com/hoststorm/livestorm/ScreenStreamService.kt'
      - 'app/src/main/res/drawable/ic_notification.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct v0.3.0 patch
        run: |
          mkdir -p tools
          cat .github/v030/full* | base64 -d | gzip -d > tools/apply_v030.py
          echo '66a988dd1e905553daf1b197718cb106e9696990ac262c1e518676b9de1d7f9a  tools/apply_v030.py' | sha256sum -c -
          python tools/apply_v030.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build Live Storm 0.3.0 APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload Live Storm 0.3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: live-storm-v030-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit generated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/hoststorm/livestorm/MainActivity.kt \
                  app/src/main/java/com/hoststorm/livestorm/CameraProController.kt \
                  app/src/main/res/layout/activity_main.xml \
                  app/src/main/res/layout/dialog_camera_pro.xml \
                  app/src/main/AndroidManifest.xml \
                  app/build.gradle.kts README.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'Integra 60 FPS nativo, tela, jogos e gravação local'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
